function lsGet(k,d){ try{ var v=localStorage.getItem(k); return v===null?d:v; }catch(e){ return d; } }
function lsSet(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }

function loadTop5(){
  try{
    var a=JSON.parse(lsGet(LS_TOP,"[]"));
    if(!Array.isArray(a)) return [];
    return a.filter(function(e){ return e && typeof e.score==="number"; }).slice(0,5);
  }catch(e){ return []; }
}
function saveTop5(a){ lsSet(LS_TOP, JSON.stringify(a.slice(0,5))); }
function recordGame(){
  G.isNewBest=false;
  if(G.score<=0) return;
  if(G.score>G.best){ G.best=G.score; lsSet(LS_BEST,String(G.best)); G.isNewBest=true; }
  else if(G.score===G.best && G.score>0) G.isNewBest=true;
  var entry={score:G.score, lines:G.lines, level:G.level, date:new Date().toISOString().slice(0,10)};
  var top=loadTop5();
  top.push(entry);
  top.sort(function(a,b){ return b.score-a.score || b.lines-a.lines; });
  G.top5=top.slice(0,5);
  saveTop5(G.top5);
}
function pad2(n){ return (n<10?"0":"")+n; }

function rr(c,x,y,w,h,r){
  r=Math.min(r,w/2,h/2);
  c.beginPath(); c.moveTo(x+r,y); c.lineTo(x+w-r,y); c.arcTo(x+w,y,x+w,y+r,r);
  c.lineTo(x+w,y+h-r); c.arcTo(x+w,y+h,x+w-r,y+h,r);
  c.lineTo(x+r,y+h); c.arcTo(x,y+h,x,y+h-r,r);
  c.lineTo(x,y+r); c.arcTo(x,y,x+r,y,r); c.closePath();
}

function readInsets(){
  try{ var cs=getComputedStyle(safeEl);
    return {t:parseFloat(cs.paddingTop)||0,r:parseFloat(cs.paddingRight)||0,b:parseFloat(cs.paddingBottom)||0,l:parseFloat(cs.paddingLeft)||0};
  }catch(e){ return {t:0,r:0,b:0,l:0}; }
}
function resize(){
  var cw=window.innerWidth, ch=window.innerHeight;
  var dpr=Math.min(window.devicePixelRatio||1, TOUCH_DEV?2:3);
  var budget=TOUCH_DEV?4.5e6:9e6;
  if(cw*ch*dpr*dpr>budget) dpr=Math.max(1,Math.sqrt(budget/(cw*ch)));
  canvas.width=Math.max(1,Math.round(cw*dpr));
  canvas.height=Math.max(1,Math.round(ch*dpr));
  var ins=readInsets();
  var aw=Math.max(1,cw-ins.l-ins.r), ah=Math.max(1,ch-ins.t-ins.b), s;
  if(ah/aw>=1.05){
    LAY.mode="port"; LAY.LWc=390; s=aw/390; LAY.LHc=ah/s;
    if(LAY.LHc<700){ LAY.LHc=700; s=Math.min(aw/390,ah/700); }
  } else {
    LAY.mode="land"; LAY.LWc=1280; LAY.LHc=800; s=Math.min(aw/1280,ah/800);
  }
  view={scale:s,ox:ins.l+(aw-LAY.LWc*s)/2,oy:ins.t+(ah-LAY.LHc*s)/2,dpr:dpr,cw:cw,ch:ch};
  LAY.u=clamp((TOUCH_DEV?0.7:0.5)/s,1,1.55);
  layoutBoard();
}

var SND={ctx:null,out:null,buf:{},want:{},decoded:0,failed:0,unlocked:false,played:[],lossHist:[]};
function sndInit(){
  if(SND.ctx) return;
  var AC=window.AudioContext||window.webkitAudioContext; if(!AC) return;
  try{ SND.ctx=new AC(); }catch(e){ SND.ctx=null; return; }
  SND.out=SND.ctx.createGain(); SND.out.gain.value=0.9; SND.out.connect(SND.ctx.destination);
  Object.keys(SND_SRC).forEach(function(name){
    try{
      var bin=atob(SND_SRC[name]), u8=new Uint8Array(bin.length);
      for(var i=0;i<bin.length;i++) u8[i]=bin.charCodeAt(i);
      var ok=function(b){ SND.buf[name]=b; SND.decoded++; if(SND.want[name]&&performance.now()-SND.want[name]<600){ delete SND.want[name]; sndStart(name); } };
      var p=SND.ctx.decodeAudioData(u8.buffer,ok,function(){ SND.failed++; });
      if(p&&p.catch) p.catch(function(){});
    }catch(e){ SND.failed++; }
  });
}
function sndUnlock(){
  sndInit(); var c=SND.ctx; if(!c) return;
  try{
    if(c.state!=="running"&&c.resume){ var r=c.resume(); if(r&&r.catch) r.catch(function(){}); }
    if(!SND.unlocked){ var b=c.createBuffer(1,1,22050), src=c.createBufferSource(); src.buffer=b; src.connect(c.destination); src.start(0); SND.unlocked=true; }
  }catch(e){}
}
["keydown","pointerdown","touchend","mousedown","click"].forEach(function(ev){ window.addEventListener(ev,sndUnlock,true); });
function sndStart(name){ try{ var src=SND.ctx.createBufferSource(); src.buffer=SND.buf[name]; src.connect(SND.out); src.start(0); }catch(e){} }
function playSnd(name){
  SND.played.push(name); if(SND.played.length>50) SND.played.shift();
  if(!SND.ctx) return;
  if(SND.buf[name]) sndStart(name); else SND.want[name]=performance.now();
}
function lossSound(){
  var h=SND.lossHist, n=Math.random()<0.5?"nee":"mist";
  if(h.length>=2&&h[h.length-1]===n&&h[h.length-2]===n) n=n==="nee"?"mist":"nee";
  h.push(n); if(h.length>4) h.shift();
  return n;
}

// ---- game state ----
var G={
  screen:"start", // start | game | over
  paused:false,
  board:[], // ROWS x COLS of null|{type}
  piece:null, next:null, hold:null, holdUsed:false,
  bag:[],
  score:0, lines:0, level:1, best: parseInt(lsGet(LS_BEST,"0"),10)||0,
  top5: (function(){ try{ return loadTop5(); }catch(e){ return []; } })(), isNewBest:false,
  dropAcc:0, lockAcc:0, lockLimit:0.5,
  softDrop:false,
  dasDir:0, dasAcc:0, arrAcc:0,
  solder:null, // {rows:[], t:0, dur:0.55, tipX:0}
  freezeAnim:false,
  parts:[],
  buttons:[],
  touchUI:TOUCH_DEV,
  sessionStarted:false,
  field:null, cell:0, gap:1,
  hudY:0,
  msg:"", msgT:0,
  time:0,
  combo:-1,
  lastClear:0
};

function emptyBoard(){
  var b=[], y, x;
  for(y=0;y<ROWS;y++){ b[y]=[]; for(x=0;x<COLS;x++) b[y][x]=null; }
  return b;
}
function refillBag(){
  var a=BAG_TYPES.slice(), i, j, t;
  for(i=a.length-1;i>0;i--){ j=(Math.random()*(i+1))|0; t=a[i]; a[i]=a[j]; a[j]=t; }
  G.bag=G.bag.concat(a);
}
function nextType(){ if(G.bag.length<7) refillBag(); return G.bag.shift(); }
function spawnPiece(type){
  type=type||nextType();
  var p={type:type, rot:0, x:3, y:0};
  if(type==="I") p.y=-1;
  if(type==="O") p.x=4;
  return p;
}
function cellsOf(p){
  var sh=SHAPES[p.type][p.rot], out=[], i;
  for(i=0;i<sh.length;i++) out.push([p.x+sh[i][0], p.y+sh[i][1]]);
  return out;
}
function collides(p){
  var cs=cellsOf(p), i, x, y;
  for(i=0;i<cs.length;i++){
    x=cs[i][0]; y=cs[i][1];
    if(x<0||x>=COLS||y>=ROWS) return true;
    if(y>=0&&G.board[y][x]) return true;
  }
  return false;
}
function ghostY(p){
  var g={type:p.type,rot:p.rot,x:p.x,y:p.y};
  while(true){ g.y++; if(collides(g)){ g.y--; break; } }
  return g.y;
}
function lockPiece(){
  var cs=cellsOf(G.piece), i, x, y, over=false;
  for(i=0;i<cs.length;i++){
    x=cs[i][0]; y=cs[i][1];
    if(y<0){ over=true; continue; }
    G.board[y][x]={type:G.piece.type};
  }
  if(over){ G.piece=null; gameOver(); return; }
  var full=[];
  for(y=0;y<ROWS;y++){
    var ok=true;
    for(x=0;x<COLS;x++) if(!G.board[y][x]){ ok=false; break; }
    if(ok) full.push(y);
  }
  G.holdUsed=false;
  if(full.length){
    startSolder(full);
  } else {
    G.combo=-1;
    spawnNext();
  }
}
function startSolder(rows){
  G.solder={rows:rows.slice(), t:0, dur:0.62, tipX:0, lastEmit:-1, blobs:[]};
  // pre-place pin solder blob targets (silver dots appear behind the tip)
  var r, x;
  for(r=0;r<rows.length;r++){
    for(x=0;x<COLS;x++){
      G.solder.blobs.push({x:x+0.28, y:rows[r]+0.72, on:false});
      G.solder.blobs.push({x:x+0.72, y:rows[r]+0.72, on:false});
    }
  }
}
function finishSolder(){
  var rows=G.solder.rows, n=rows.length, y, x, r, scoreAdd;
  // remove rows bottom-up
  rows.sort(function(a,b){ return a-b; });
  for(r=rows.length-1;r>=0;r--){
    G.board.splice(rows[r],1);
    var empty=[]; for(x=0;x<COLS;x++) empty.push(null);
    G.board.unshift(empty);
  }
  G.combo = G.combo<0 ? 0 : G.combo+1;
  var base={1:100,2:300,3:500,4:800}[n]||100;
  scoreAdd = base * G.level + Math.max(0,G.combo)*50*G.level;
  G.score += scoreAdd;
  G.lines += n;
  G.lastClear = n;
  var oldLevel=G.level;
  G.level = 1 + Math.floor(G.lines/10);
  if(n>=4 || G.level>oldLevel) playSnd("pure-energy");
  else playSnd("prima");
  G.msg = n===4 ? "tetris!" : (n+" reihe"+(n>1?"n":"")+" verlötet");
  G.msgT = 1.4;
  if(G.score>G.best){ G.best=G.score; lsSet(LS_BEST,String(G.best)); }
  G.solder=null;
  spawnNext();
}
function spawnNext(){
  if(!G.next) G.next=spawnPiece(nextType());
  G.piece=G.next;
  G.next=spawnPiece(nextType());
  G.dropAcc=0; G.lockAcc=0;
  if(collides(G.piece)) gameOver();
}
function gameOver(){
  G.screen="over";
  G.paused=false;
  playSnd(lossSound());
  recordGame();
}
function startGame(){
  G.board=emptyBoard();
  G.bag=[]; G.hold=null; G.holdUsed=false;
  G.score=0; G.lines=0; G.level=1; G.combo=-1; G.isNewBest=false;
  G.solder=null; G.parts=[]; G.paused=false;
  G.screen="game"; G.msg=""; G.msgT=0;
  G.next=null; G.piece=null;
  spawnNext();
  if(!G.sessionStarted){ G.sessionStarted=true; playSnd("los-gehts"); }
}
function tryMove(dx,dy){
  if(!G.piece||G.solder) return false;
  var p={type:G.piece.type,rot:G.piece.rot,x:G.piece.x+dx,y:G.piece.y+dy};
  if(collides(p)) return false;
  G.piece.x=p.x; G.piece.y=p.y;
  if(dy>0) G.lockAcc=0;
  return true;
}
function tryRotate(dir){
  if(!G.piece||G.solder) return false;
  if(G.piece.type==="O"){ playSnd("a"); return true; }
  var from=G.piece.rot, to=(from+dir+4)%4;
  var key=from+">"+to;
  var kicks=(G.piece.type==="I"?KICKS_I:KICKS_JLSTZ)[key]||[[0,0]];
  var i, kx, ky, p;
  for(i=0;i<kicks.length;i++){
    kx=kicks[i][0]; ky=-kicks[i][1]; // SRS y is up; our y is down
    p={type:G.piece.type,rot:to,x:G.piece.x+kx,y:G.piece.y+ky};
    if(!collides(p)){ G.piece=p; G.lockAcc=0; playSnd("a"); return true; }
  }
  return false;
}
function hardDrop(){
  if(!G.piece||G.solder) return;
  var dist=0;
  while(tryMove(0,1)) dist++;
  G.score += dist*2;
  playSnd("k");
  lockPiece();
}
function softDropStep(){
  if(tryMove(0,1)){ G.score+=1; return true; }
  return false;
}
function doHold(){
  if(!G.piece||G.holdUsed||G.solder) return;
  var t=G.piece.type;
  if(G.hold){
    G.piece=spawnPiece(G.hold);
    G.hold=t;
  } else {
    G.hold=t;
    spawnNext();
  }
  G.holdUsed=true;
  playSnd("b");
}
function dropInterval(){
  // level 1 ~ 0.8s, faster each level, floor ~0.05s
  return Math.max(0.05, 0.8 * Math.pow(0.82, G.level-1));
}

function layoutBoard(){
  var Lw=LAY.LWc, Lh=LAY.LHc, u=LAY.u;
  var top, boardMaxW, boardMaxH, cell, bw, bh, gap=1;
  if(LAY.mode==="port"){
    top=Math.max(8,(Lh-700)*0.08)+44*u;
    boardMaxW=Lw-28;
    boardMaxH=Lh-top-168*u;
    cell=Math.floor(Math.min(boardMaxW/COLS, boardMaxH/ROWS));
    cell=Math.max(14,cell);
    bw=COLS*cell; bh=ROWS*cell;
    G.field={x:(Lw-bw)/2, y:top+4, w:bw, h:bh, r:8};
    G.cell=cell; G.gap=gap;
    G.hudY=G.field.y+G.field.h+14*u;
    LAY.logo={cx:Lw/2, y:8*u, h:26*u};
    LAY.pause={x:Lw-28*u, y:18*u, r:16*u};
    // side panels for next/hold — overlaid near top of field
    G.side={nextX:G.field.x+G.field.w+6, holdX:G.field.x-6-cell*3, panelY:G.field.y, panelCell:Math.max(10,cell*0.55)};
  } else {
    top=56; gap=1;
    // cell sized so 10x20 board fits nicely; white card wraps tightly (pad 8)
    cell=Math.floor(Math.min(360/COLS, 700/ROWS));
    cell=Math.max(28, Math.min(cell, 34));
    bw=COLS*cell; bh=ROWS*cell;
    var pad=8;
    var fx=72;
    G.field={x:fx+pad, y:top+pad, w:bw, h:bh, r:10,
      cardX:fx, cardY:top, cardW:bw+pad*2, cardH:bh+pad*2};
    G.cell=cell; G.gap=gap;
    LAY.logo={cx:fx+(bw+pad*2)/2, y:14, h:30};
    LAY.pause={x:Lw-40, y:28, r:18};
    G.hudY=0;
    G.side={nextX:fx+bw+pad*2+36, holdX:fx+bw+pad*2+36, panelY:top+8, panelCell:Math.max(14, cell*0.55)};
  }
}

function drawLogo(cx, y, beakH){
  var c=ctx;
  c.save();
  c.textAlign="left"; c.textBaseline="alphabetic";
  c.fillStyle=WHITE;
  var beakSize=beakH*0.92;
  c.font=beakSize+"px Aeonis";
  var letters=["B","E","A","K"], gap=beakSize*0.18;
  var widths=[], total=0, i;
  for(i=0;i<letters.length;i++){ widths[i]=c.measureText(letters[i]).width; total+=widths[i]+(i?gap:0); }
  var dotR=beakSize*0.07;
  total += gap*0.7 + dotR*2;
  var sub="lötkolben-tetris";
  var subSize=Math.max(beakSize*(LAY.mode==="port"?0.42:0.55), LAY.mode==="port"?14:22);
  c.font=subSize+"px NunitoLI";
  var track=subSize*0.08, subW=0;
  for(i=0;i<sub.length;i++) subW+=c.measureText(sub[i]).width+(i<sub.length-1?track:0);
  var gapLogo=beakSize*0.22;
  var fullW=total+gapLogo+subW;
  var x=cx-fullW/2;
  c.font=beakSize+"px Aeonis"; c.fillStyle=WHITE; c.globalAlpha=1;
  var baseline=y+beakSize*0.82;
  for(i=0;i<letters.length;i++){ c.fillText(letters[i], x, baseline); x+=widths[i]+gap; }
  c.beginPath(); c.arc(x+dotR, baseline-beakSize*0.28, dotR, 0, Math.PI*2); c.fill();
  x+=dotR*2+gapLogo;
  c.font=subSize+"px NunitoLI"; c.globalAlpha=0.55; c.fillStyle=WHITE;
  for(i=0;i<sub.length;i++){ c.fillText(sub[i], x, baseline); x+=c.measureText(sub[i]).width+track; }
  c.globalAlpha=1;
  c.restore();
  return {w:fullW, h:beakH};
}

function cellPx(cx,cy){
  var f=G.field, cell=G.cell;
  return {x:f.x+cx*cell, y:f.y+cy*cell, s:cell};
}

function drawComponent(c, px, py, s, type, ghost){
  var meta=COMP[type]||{label:type,kind:"ic"};
  var kind=meta.kind;
  var cx=px+s/2, cy=py+s/2;
  var G1="#505050", G2="#3a3a3a", G3="#6a6a6a", G4="#2e2e2e", GL="#8a8a8a";
  c.save();
  if(ghost){ c.globalAlpha=0.2; }
  // faint cell pad (PCB square) — keeps grid readable
  c.fillStyle=ghost?"rgba(80,80,80,0.15)":"rgba(80,80,80,0.08)";
  rr(c, px+s*0.04, py+s*0.04, s*0.92, s*0.92, s*0.1); c.fill();

  if(kind==="resistor"){
    // axial resistor: body + end caps + grey color bands + wire leads
    var by=cy-s*0.22, bh=s*0.44, bx=px+s*0.18, bw=s*0.64;
    c.fillStyle=G1; c.fillRect(px+s*0.02, cy-s*0.05, s*0.16, s*0.1); // left lead
    c.fillRect(px+s*0.82, cy-s*0.05, s*0.16, s*0.1); // right lead
    rr(c, bx, by, bw, bh, s*0.12); c.fillStyle=G3; c.fill();
    // end caps darker
    c.fillStyle=G2; c.fillRect(bx, by, s*0.1, bh); c.fillRect(bx+bw-s*0.1, by, s*0.1, bh);
    // color bands (grey shades)
    var bands=[0.22,0.38,0.52,0.68], shades=[G4,GL,G2,"#949494"], bi;
    for(bi=0;bi<bands.length;bi++){
      c.fillStyle=shades[bi];
      c.fillRect(bx+bw*bands[bi], by+bh*0.08, s*0.07, bh*0.84);
    }
  } else if(kind==="crystal"){
    // HC-49 crystal / square can: metal oval + wire stubs
    c.fillStyle=G1;
    c.fillRect(cx-s*0.08, py+s*0.08, s*0.16, s*0.14); // top stub
    c.fillRect(cx-s*0.08, py+s*0.78, s*0.16, s*0.14);
    c.beginPath(); c.ellipse(cx, cy, s*0.32, s*0.36, 0, 0, Math.PI*2); c.fillStyle=G3; c.fill();
    c.beginPath(); c.ellipse(cx, cy, s*0.22, s*0.26, 0, 0, Math.PI*2); c.fillStyle=G1; c.fill();
    // seam line
    c.strokeStyle=G4; c.lineWidth=Math.max(1,s*0.04);
    c.beginPath(); c.moveTo(cx-s*0.2, cy); c.lineTo(cx+s*0.2, cy); c.stroke();
  } else if(kind==="transistor"){
    // TO-92: flat face + rounded back + 3 legs
    c.fillStyle=G1;
    for(var ti=0;ti<3;ti++) c.fillRect(px+s*(0.22+ti*0.22), py+s*0.78, s*0.1, s*0.18);
    c.beginPath();
    c.moveTo(px+s*0.18, py+s*0.72);
    c.lineTo(px+s*0.18, py+s*0.28);
    c.quadraticCurveTo(cx, py+s*0.08, px+s*0.82, py+s*0.28);
    c.lineTo(px+s*0.82, py+s*0.72);
    c.closePath(); c.fillStyle=G2; c.fill();
    // flat face highlight
    c.fillStyle=G3;
    c.fillRect(px+s*0.22, py+s*0.32, s*0.56, s*0.36);
    c.fillStyle=G4;
    c.beginPath(); c.arc(cx, cy-s*0.02, s*0.08, 0, Math.PI*2); c.fill(); // mark
  } else if(kind==="cap"){
    // round ceramic disc capacitor + two leads
    c.fillStyle=G1;
    c.fillRect(px+s*0.12, cy-s*0.05, s*0.12, s*0.1);
    c.fillRect(px+s*0.76, cy-s*0.05, s*0.12, s*0.1);
    c.beginPath(); c.arc(cx, cy, s*0.34, 0, Math.PI*2); c.fillStyle=G2; c.fill();
    c.beginPath(); c.arc(cx, cy, s*0.26, 0, Math.PI*2); c.fillStyle=G3; c.fill();
    // value stripe
    c.strokeStyle=G4; c.lineWidth=Math.max(1.5,s*0.06);
    c.beginPath(); c.arc(cx, cy, s*0.18, -0.6, Math.PI+0.6); c.stroke();
  } else {
    // IC DIP package: body + notch + pin rows left/right
    var ibx=px+s*0.22, iby=py+s*0.14, ibw=s*0.56, ibh=s*0.72;
    c.fillStyle=G2; rr(c, ibx, iby, ibw, ibh, s*0.06); c.fill();
    // orientation notch
    c.fillStyle=G4;
    c.globalAlpha=ghost?0.2:1;
    c.beginPath(); c.arc(cx, iby, s*0.1, 0, Math.PI); c.fill();
    // pin rows
    c.fillStyle=G1;
    for(var pk=0;pk<3;pk++){
      var py0=iby+s*0.14+pk*s*0.18;
      c.fillRect(px+s*0.06, py0, s*0.16, s*0.08);
      c.fillRect(px+s*0.78, py0, s*0.16, s*0.08);
    }
    // chip label area
    c.fillStyle=G4; c.fillRect(ibx+ibw*0.15, iby+ibh*0.35, ibw*0.7, ibh*0.18);
  }
  // short label only if cell large enough — secondary to silhouette
  if(s>=22 && !ghost){
    c.fillStyle="rgba(255,255,255,0.9)";
    c.font=Math.max(8, Math.min(12, s*0.28))+"px NunitoSB";
    c.textAlign="center"; c.textBaseline="middle";
    var labY = kind==="ic" ? cy+s*0.18 : (kind==="resistor"? cy+s*0.32 : cy+s*0.38);
    if(kind==="ic"||kind==="resistor") c.fillText(meta.label, cx, labY);
  }
  c.restore();
}

function drawMiniPiece(c, type, ox, oy, cell){
  if(!type) return;
  var sh=SHAPES[type][0], i, minX=99,minY=99,maxX=0,maxY=0;
  for(i=0;i<sh.length;i++){ minX=Math.min(minX,sh[i][0]); minY=Math.min(minY,sh[i][1]); maxX=Math.max(maxX,sh[i][0]); maxY=Math.max(maxY,sh[i][1]); }
  var w=(maxX-minX+1)*cell, h=(maxY-minY+1)*cell;
  var bx=ox-w/2, by=oy-h/2;
  for(i=0;i<sh.length;i++){
    drawComponent(c, bx+(sh[i][0]-minX)*cell, by+(sh[i][1]-minY)*cell, cell, type, false);
  }
}

function drawBoard(){
  var c=ctx, f=G.field, cell=G.cell, x, y, p;
  c.save();
  // white playfield card — tightly around the 10x20 grid
  if(f.cardX!=null){
    rr(c,f.cardX,f.cardY,f.cardW,f.cardH,10); c.fillStyle=WHITE; c.fill();
  } else {
    rr(c,f.x-6,f.y-6,f.w+12,f.h+12,10); c.fillStyle=WHITE; c.fill();
  }
  // subtle grid
  c.strokeStyle="rgba(80,80,80,0.08)"; c.lineWidth=1;
  for(x=0;x<=COLS;x++){ c.beginPath(); c.moveTo(f.x+x*cell,f.y); c.lineTo(f.x+x*cell,f.y+f.h); c.stroke(); }
  for(y=0;y<=ROWS;y++){ c.beginPath(); c.moveTo(f.x,f.y+y*cell); c.lineTo(f.x+f.w,f.y+y*cell); c.stroke(); }

  // locked cells
  for(y=0;y<ROWS;y++) for(x=0;x<COLS;x++){
    if(G.board[y][x]){
      p=cellPx(x,y);
      // during solder, rows being soldered get glow
      var soldering=G.solder&&G.solder.rows.indexOf(y)>=0;
      if(soldering){
        c.save();
        c.shadowColor=SOLDER_HOT; c.shadowBlur=8;
        drawComponent(c,p.x,p.y,cell,G.board[y][x].type,false);
        c.restore();
      } else {
        drawComponent(c,p.x,p.y,cell,G.board[y][x].type,false);
      }
    }
  }

  // ghost + active piece
  if(G.piece&&G.screen==="game"&&!G.solder){
    var gy=ghostY(G.piece), cs, i;
    var ghost={type:G.piece.type,rot:G.piece.rot,x:G.piece.x,y:gy};
    cs=cellsOf(ghost);
    for(i=0;i<cs.length;i++) if(cs[i][1]>=0){ p=cellPx(cs[i][0],cs[i][1]); drawComponent(c,p.x,p.y,cell,G.piece.type,true); }
    cs=cellsOf(G.piece);
    for(i=0;i<cs.length;i++) if(cs[i][1]>=0){ p=cellPx(cs[i][0],cs[i][1]); drawComponent(c,p.x,p.y,cell,G.piece.type,false); }
  }

  // solder iron effect (visible tip + handle, silver blobs, sparks, smoke, flash)
  if(G.solder){
    var S=G.solder, u=clamp(S.t/S.dur,0,1);
    // tip travels across for ~75% of duration, then flash/vanish
    var tipProg=clamp(u/0.75,0,1);
    S.tipX=tipProg*(COLS+0.35);
    // light pin blobs behind tip
    for(var bi=0;bi<S.blobs.length;bi++){
      if(!S.blobs[bi].on && S.blobs[bi].x <= S.tipX+0.15) S.blobs[bi].on=true;
    }
    // emit sparks/smoke at tip column
    var emitCol=Math.floor(S.tipX);
    if(emitCol!==S.lastEmit && tipProg<1){
      S.lastEmit=emitCol;
      for(var ri0=0;ri0<S.rows.length;ri0++){
        var ry0=S.rows[ri0];
        for(var ei=0;ei<7;ei++){
          G.parts.push({k:"spark", x:S.tipX+(Math.random()-0.5)*0.5, y:ry0+0.3+Math.random()*0.4,
            vx:(Math.random()-0.5)*10, vy:-3-Math.random()*6,
            life:0.3+Math.random()*0.35, t:0, col:Math.random()<0.4?"#ffffff":(Math.random()<0.5?SOLDER_HOT:"#ffcc66")});
        }
        for(var si=0;si<2;si++){
          G.parts.push({k:"smoke", x:S.tipX+(Math.random()-0.5)*0.3, y:ry0+0.1+Math.random()*0.2,
            vx:(Math.random()-0.5)*0.7, vy:-0.9-Math.random()*0.8,
            life:0.6+Math.random()*0.4, t:0, r:0.25+Math.random()*0.3});
        }
      }
      if(G.parts.length>350) G.parts.splice(0, G.parts.length-350);
    }
    // silver solder dots on pins
    for(bi=0;bi<S.blobs.length;bi++){
      if(!S.blobs[bi].on) continue;
      var bx=f.x+S.blobs[bi].x*cell, by=f.y+S.blobs[bi].y*cell;
      c.save();
      c.fillStyle="#d8d8d8"; c.globalAlpha=0.95;
      c.beginPath(); c.ellipse(bx, by, cell*0.16, cell*0.12, 0, 0, Math.PI*2); c.fill();
      c.fillStyle="#ffffff"; c.globalAlpha=0.85;
      c.beginPath(); c.ellipse(bx-cell*0.04, by-cell*0.03, cell*0.06, cell*0.04, 0, 0, Math.PI*2); c.fill();
      c.restore();
    }
    for(var ri=0;ri<S.rows.length;ri++){
      var ry=S.rows[ri];
      var tipPx=f.x+S.tipX*cell;
      var rowY=f.y+ry*cell+cell*0.55;
      c.save();
      // warm glow along soldered stretch
      if(tipProg>0.02){
        var g=c.createLinearGradient(f.x, rowY, tipPx, rowY);
        g.addColorStop(0,"rgba(201,168,106,0)"); g.addColorStop(0.7,"rgba(255,230,160,0.35)"); g.addColorStop(1,"rgba(255,255,255,0.55)");
        c.fillStyle=g; c.fillRect(f.x, f.y+ry*cell, Math.min(tipPx, f.x+f.w)-f.x, cell);
      }
      if(tipProg<1){
        // soldering iron: chunky handle + silver shaft + pointed tip (readable at cell size)
        var tipLen=cell*2.4, handleLen=cell*1.8, h=cell*0.72;
        c.translate(tipPx + cell*0.15, rowY);
        c.rotate(-0.42);
        // soft shadow under iron
        c.fillStyle="rgba(0,0,0,0.18)";
        rr(c, cell*0.1, -h*0.35+cell*0.06, handleLen+tipLen*0.5, h*0.9, h*0.3); c.fill();
        // handle (dark grey rubber)
        c.fillStyle="#333333";
        rr(c, cell*0.35, -h*0.55, handleLen, h*1.1, h*0.4); c.fill();
        c.fillStyle="#222222";
        rr(c, cell*0.45, -h*0.32, handleLen*0.85, h*0.64, h*0.22); c.fill();
        // grip rings
        c.strokeStyle="#4a4a4a"; c.lineWidth=Math.max(1,cell*0.04);
        for(var gi=0;gi<3;gi++){
          var gx=cell*0.55+gi*handleLen*0.22;
          c.beginPath(); c.moveTo(gx, -h*0.4); c.lineTo(gx, h*0.4); c.stroke();
        }
        // metal collar
        c.fillStyle="#c8c8c8";
        c.fillRect(cell*0.15, -h*0.28, cell*0.28, h*0.56);
        // shaft
        c.fillStyle="#d0d0d0";
        c.fillRect(-tipLen*0.35, -h*0.18, tipLen*0.55, h*0.36);
        // conical tip
        c.fillStyle="#f2f2f2";
        c.beginPath();
        c.moveTo(-tipLen*0.3, -h*0.22);
        c.lineTo(-tipLen*0.95, 0);
        c.lineTo(-tipLen*0.3, h*0.22);
        c.closePath(); c.fill();
        c.strokeStyle="#9a9a9a"; c.lineWidth=1; c.stroke();
        // hot tip glow
        c.fillStyle=SOLDER_HOT; c.globalAlpha=1;
        c.beginPath(); c.arc(-tipLen*0.88, 0, cell*0.14, 0, Math.PI*2); c.fill();
        c.globalAlpha=0.55; c.fillStyle="#fff4c0";
        c.beginPath(); c.arc(-tipLen*0.88, 0, cell*0.32, 0, Math.PI*2); c.fill();
        c.globalAlpha=0.3; c.fillStyle="#ffffff";
        c.beginPath(); c.arc(-tipLen*0.88, 0, cell*0.5, 0, Math.PI*2); c.fill();
      }
      c.restore();
    }
    // white flash then vanish (last 25%)
    if(u>0.75){
      var flash=(u-0.75)/0.25;
      c.fillStyle="rgba(255,255,255,"+(0.55+0.45*Math.min(1,flash*1.4))+")";
      for(ri=0;ri<S.rows.length;ri++){
        c.fillRect(f.x-1, f.y+S.rows[ri]*cell-1, f.w+2, cell+2);
      }
    }
  }

  // particles
  for(var pi=0;pi<G.parts.length;pi++){
    var q=G.parts[pi], lf=1-q.t/q.life;
    var qx=f.x+q.x*cell, qy=f.y+q.y*cell;
    if(q.k==="spark"){
      c.globalAlpha=Math.min(1,lf*1.4); c.strokeStyle=q.col; c.lineWidth=Math.max(1.5, cell*0.06*lf);
      c.beginPath(); c.moveTo(qx,qy); c.lineTo(qx-q.vx*cell*0.06, qy-q.vy*cell*0.06); c.stroke();
      c.fillStyle=q.col; c.beginPath(); c.arc(qx,qy, cell*0.04, 0, Math.PI*2); c.fill();
    } else {
      c.globalAlpha=0.4*lf; c.fillStyle="#bcbcbc";
      c.beginPath(); c.arc(qx,qy, q.r*cell*(0.8+1.2*(1-lf)), 0, Math.PI*2); c.fill();
    }
  }
  c.globalAlpha=1;

  // overlays pause / msg
  if(G.msgT>0&&G.msg&&!G.paused){
    c.globalAlpha=clamp(G.msgT/0.35,0,1);
    c.fillStyle=PINK; c.font=(Math.max(16,cell*0.55))+"px NunitoSB";
    c.textAlign="center"; c.textBaseline="middle";
    c.fillText(G.msg, f.x+f.w/2, f.y+f.h*0.42);
    c.globalAlpha=1;
  }
  if(G.paused&&G.screen==="game"&&!G.solder&&!G.freezeAnim){
    c.fillStyle="rgba(255,255,255,0.82)"; c.fillRect(f.x,f.y,f.w,f.h);
    c.fillStyle=GREY; c.font="42px NunitoSB"; c.textAlign="center"; c.textBaseline="middle";
    c.fillText("pause", f.x+f.w/2, f.y+f.h/2-10);
    c.font="16px NunitoLI"; c.fillText(G.touchUI?"tippen zum weiterspielen":"p / esc zum weiterspielen", f.x+f.w/2, f.y+f.h/2+28);
  }
  c.restore();
}

}

function render(){
  var c=ctx, dpr=view.dpr;
  c.setTransform(dpr,0,0,dpr,0,0);
  c.clearRect(0,0,view.cw,view.ch);
  c.fillStyle=PINK; c.fillRect(0,0,view.cw,view.ch);
  c.save();
  c.translate(view.ox, view.oy);
  c.scale(view.scale, view.scale);
  if(G.screen==="start") drawStart();
  else if(G.screen==="over"){ drawOver(); drawPauseBtn(); }
  else {
    drawLogo(LAY.logo.cx, LAY.logo.y, LAY.logo.h);
    drawBoard();
    drawHUD();
    drawPauseBtn();
  }
  c.restore();
}

function updateParts(dt){
  for(var i=G.parts.length-1;i>=0;i--){
    var q=G.parts[i]; q.t+=dt;
    if(q.t>=q.life){ G.parts.splice(i,1); continue; }
    q.x+=q.vx*dt; q.y+=q.vy*dt;
    if(q.k==="smoke"){ q.vx*=0.98; q.r+=dt*0.15; }
  }
}
function update(dt){
  G.time+=dt;
  if(G.msgT>0) G.msgT=Math.max(0,G.msgT-dt);
  updateParts(dt);
  if(G.screen!=="game"||G.paused) return;
  if(G.freezeAnim) return;
  if(G.solder){
    G.solder.t+=dt;
    if(G.solder.t>=G.solder.dur) finishSolder();
    return;
  }
  // DAS/ARR
  if(G.dasDir){
    G.dasAcc+=dt;
    if(G.dasAcc>=0.17){
      G.arrAcc+=dt;
      while(G.arrAcc>=0.04){ G.arrAcc-=0.04; if(!tryMove(G.dasDir,0)) break; }
    }
  }
  // gravity
  var interval=G.softDrop?Math.min(0.05, dropInterval()/12):dropInterval();
  G.dropAcc+=dt;
  while(G.dropAcc>=interval){
    G.dropAcc-=interval;
    if(!tryMove(0,1)){
      G.lockAcc+=interval;
      if(G.lockAcc>=G.lockLimit) lockPiece();
      break;
    } else if(G.softDrop) G.score+=1;
  }
}

var last=0;
function frame(now){
  if(!last) last=now;
  var dt=Math.min(0.05,(now-last)/1000); last=now;
  update(dt); render();
  requestAnimationFrame(frame);
}

function toLogic(clientX,clientY){
  return {x:(clientX-view.ox)/view.scale, y:(clientY-view.oy)/view.scale};
}
function hitButton(lx,ly){
  for(var i=0;i<G.buttons.length;i++){
    var b=G.buttons[i];
    if(lx>=b.x&&lx<=b.x+b.w&&ly>=b.y&&ly<=b.y+b.h) return b;
  }
  return null;
}
function inPause(lx,ly){
  var P=LAY.pause; return Math.hypot(lx-P.x,ly-P.y)<=Math.max(P.r+14, 26/view.scale);
}

// ---- keyboard ----
var keys={};
window.addEventListener("keydown", function(e){
  var k=e.key;
  if(["ArrowLeft","ArrowRight","ArrowDown","ArrowUp"," ","Spacebar"].indexOf(k)>=0||k===" ") e.preventDefault();
  if(keys[k]) return; // ignore auto-repeat for most
  keys[k]=true;
  if(G.screen==="start"){
    if(k==="Enter"||k===" "||k==="Spacebar"){ startGame(); }
    return;
  }
  if(G.screen==="over"){
    if(k==="Enter"||k===" ") startGame();
    if(k==="Escape") G.screen="start";
    return;
  }
  if(k==="p"||k==="P"||k==="Escape"){ G.paused=!G.paused; return; }
  if(G.paused){ if(k===" "||k==="Enter") G.paused=false; return; }
  if(G.solder) return;
  if(k==="ArrowLeft"){ tryMove(-1,0); G.dasDir=-1; G.dasAcc=0; G.arrAcc=0; }
  else if(k==="ArrowRight"){ tryMove(1,0); G.dasDir=1; G.dasAcc=0; G.arrAcc=0; }
  else if(k==="ArrowDown"){ G.softDrop=true; softDropStep(); playSnd("e"); }
  else if(k==="ArrowUp"||k==="x"||k==="X") tryRotate(1);
  else if(k==="z"||k==="Z"||k==="Control") tryRotate(-1);
  else if(k===" "||k==="Spacebar") hardDrop();
  else if(k==="c"||k==="C"||k==="Shift") doHold();
}, {passive:false});
window.addEventListener("keyup", function(e){
  keys[e.key]=false;
  if(e.key==="ArrowLeft"&&G.dasDir===-1) G.dasDir=0;
  if(e.key==="ArrowRight"&&G.dasDir===1) G.dasDir=0;
  if(e.key==="ArrowDown") G.softDrop=false;
});
window.addEventListener("blur", function(){ keys={}; G.dasDir=0; G.softDrop=false; if(G.screen==="game"&&!G.solder) G.paused=true; });

// ---- pointer / touch ----
var ptrs={}, gesture=null;
canvas.addEventListener("pointerdown", function(e){
  if(e.pointerType==="touch"||e.pointerType==="pen") G.touchUI=true;
  try{ canvas.setPointerCapture(e.pointerId); }catch(_){}
  var L=toLogic(e.clientX,e.clientY);
  ptrs[e.pointerId]={x0:L.x,y0:L.y,lx:L.x,ly:L.y,t0:performance.now(),moved:false,type:e.pointerType};
  if(G.screen==="game"&&inPause(L.x,L.y)){ G.paused=!G.paused; return; }
  if(G.paused&&G.screen==="game"){ G.paused=false; return; }
  var btn=hitButton(L.x,L.y);
  if(btn){ btn.act(); return; }
  if(G.screen==="game"&&G.holdBtn&&L.x>=G.holdBtn.x&&L.x<=G.holdBtn.x+G.holdBtn.w&&L.y>=G.holdBtn.y&&L.y<=G.holdBtn.y+G.holdBtn.h){
    doHold(); return;
  }
  gesture={id:e.pointerId,x0:L.x,y0:L.y,dx:0,dy:0,steps:0,did:false};
}, {passive:false});
canvas.addEventListener("pointermove", function(e){
  var q=ptrs[e.pointerId]; if(!q) return;
  var L=toLogic(e.clientX,e.clientY);
  var dx=L.x-q.lx, dy=L.y-q.ly;
  q.lx=L.x; q.ly=L.y;
  if(Math.hypot(L.x-q.x0,L.y-q.y0)>8) q.moved=true;
  if(!gesture||gesture.id!==e.pointerId||G.screen!=="game"||G.paused||G.solder) return;
  gesture.dx+=dx; gesture.dy+=dy;
  // horizontal steps: ~0.7 cell
  var step=G.cell*0.85;
  while(gesture.dx<=-step){ tryMove(-1,0); gesture.dx+=step; gesture.steps++; gesture.did=true; }
  while(gesture.dx>=step){ tryMove(1,0); gesture.dx-=step; gesture.steps++; gesture.did=true; }
  // soft drop while dragging down
  if(gesture.dy>step*0.6){ softDropStep(); gesture.dy-=step*0.5; gesture.did=true; G.softDrop=true; }
}, {passive:false});
function endPtr(e){
  var q=ptrs[e.pointerId]; delete ptrs[e.pointerId];
  G.softDrop=false;
  if(!q||!gesture||gesture.id!==e.pointerId){ gesture=null; return; }
  var L=toLogic(e.clientX,e.clientY);
  var tdx=L.x-gesture.x0, tdy=L.y-gesture.y0, dt=performance.now()-q.t0;
  var g=gesture; gesture=null;
  if(G.screen!=="game"||G.paused||G.solder) return;
  // hard drop: fast swipe down
  if(tdy>G.cell*2.2 && Math.abs(tdy)>Math.abs(tdx)*1.2 && dt<450){ hardDrop(); return; }
  // tap = rotate
  if(!g.did && !q.moved && Math.hypot(tdx,tdy)<14 && dt<350){ tryRotate(1); }
}
canvas.addEventListener("pointerup", function(e){ e.preventDefault(); endPtr(e); }, {passive:false});
canvas.addEventListener("pointercancel", function(e){ endPtr(e); });
document.addEventListener("touchmove", function(e){ e.preventDefault(); }, {passive:false});

// ---- test hooks ----
function prepareNearFull(gaps){
  // Bottom row almost full: leave `gaps` empty cells at the right (default 1).
  gaps = gaps==null?1:gaps;
  G.board=emptyBoard();
  var y,x;
  for(x=0;x<COLS-gaps;x++) G.board[ROWS-1][x]={type:"T"};
  // vertical I (rot 1) whose column x+2 lands on the first gap
  var gapX=COLS-gaps;
  G.piece={type:"I",rot:1,x:gapX-2,y:ROWS-5};
  G.next=spawnPiece("T");
  G.hold=null; G.holdUsed=false;
  G.screen="game"; G.paused=false; G.solder=null; G.parts=[];
  G.dropAcc=0; G.lockAcc=0;
  return {gapX:gapX, gapY:ROWS-1, piece:JSON.parse(JSON.stringify(G.piece))};
}
function forceClearRows(n){
  n=n||1;
  var rows=[], i;
  for(i=0;i<n;i++) rows.push(ROWS-1-i);
  // ensure those rows full
  for(i=0;i<rows.length;i++){
    for(var x=0;x<COLS;x++) G.board[rows[i]][x]={type:"T"};
  }
  startSolder(rows);
  return rows;
}

function forceGameOver(){
  G.board=emptyBoard();
  var y,x;
  for(y=0;y<ROWS;y++) for(x=0;x<COLS;x++) G.board[y][x]={type:"O"};
  G.piece={type:"O",rot:0,x:4,y:0};
  G.screen="game"; G.paused=false; G.solder=null;
  gameOver();
}
window.TETRIS = {
  LS_BEST:LS_BEST, LS_TOP:LS_TOP, loadTop5:loadTop5, recordGame:recordGame,
  G:G, VERSION:VERSION, COLS:COLS, ROWS:ROWS, COMP:COMP, SND:SND,
  startGame:startGame, tryMove:tryMove, tryRotate:tryRotate, hardDrop:hardDrop,
  doHold:doHold, softDropStep:softDropStep, lockPiece:lockPiece,
  prepareNearFull:prepareNearFull, forceClearRows:forceClearRows, forceGameOver:forceGameOver,
  cellsOf:cellsOf, collides:collides, ghostY:ghostY, dropInterval:dropInterval,
  buttonRect:function(label){
    for(var i=0;i<G.buttons.length;i++) if(G.buttons[i].label===label) return G.buttons[i];
    return null;
  },
  playfield:function(){ return G.field; },
  toClient:function(lx,ly){ return {x:view.ox+lx*view.scale, y:view.oy+ly*view.scale}; },
  view:function(){ return view; },
  pauseBtn:function(){ return LAY.pause; }
};

resize();
requestAnimationFrame(frame);
canvas.focus();
})();

</script>
